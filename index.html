<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini Geometry Dash</title>
<style>
body { margin: 0; background-color: #1b3b22; display: flex; flex-direction: column; align-items: center; padding: 16px 12px 28px; font-family: Arial, sans-serif; color: white; position: relative; min-height: 100vh; box-sizing: border-box;}
.lang-container { position: absolute; top: 16px; right: 16px;}
.lang-container select { background-color: #112816; color: #fff; border: 2px solid #00ffcc; padding: 6px 12px; border-radius: 6px; font-size: 14px; cursor: pointer; outline: none;}
h1 { margin: 8px 0 10px; font-size: 26px; text-align: center; padding-right: 110px;}
#gameCanvas { border: 4px solid #00ffcc; background-color: #0b2312; box-shadow: 0 0 25px rgba(0, 255, 128, 0.4); width: 100%; max-width: 820px; height: auto; display: block; touch-action: manipulation;}
.info { margin-top: 10px; font-size: 16px; text-align: center;}
.controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; max-width: 820px;}
.controls button { background: #112816; color: #fff; border: 2px solid #00ffcc; padding: 8px 14px; border-radius: 999px; font-size: 15px; cursor: pointer;}
.controls button.active { background: #00ffcc; color: #06281c; font-weight: bold;}
.controls button:active { transform: scale(.94);}
#status { margin-top: 10px; font-size: 14px; color: #bfe8d2; text-align: center;}
.ver { margin-top: 8px; font-size: 12px; color: #7fae8d; text-align: center;}
</style>
</head>
<body>
<div class="lang-container">
<select id="langSelect" onchange="changeLanguage()">
<option value="en" selected>English</option>
<option value="zh">中文 (Chinese)</option>
<option value="fr">Français (French)</option>
<option value="ja">日本語 (Japanese)</option>
</select>
</div>
<h1 id="title">🚀 Mini Geometry Dash</h1>
<canvas id="gameCanvas" width="800" height="400"></canvas>
<div class="info" id="instructions">Click the game or press [Space] to jump!</div>
<div class="controls">
<button id="lvl0" onclick="selectLevel(0)">🌱 Lv 1</button>
<button id="lvl1" onclick="selectLevel(1)">🔥 Lv 2</button>
<button id="lvl2" onclick="selectLevel(2)">🌙 Lv 3</button>
<button id="soundBtn" onclick="toggleSound()">🔊 Sound</button>
<button id="pauseBtn" onclick="togglePause()">⏸ Pause</button>
</div>
<div id="status"></div>
<div class="ver">Mini Geometry Dash v2.0 · Space / tap = jump · P = pause · Esc = menu</div>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const groundY = 340;

const translations = {
en: { title: "🚀 Mini Geometry Dash", instructions: "Click the game or press [Space] to jump! Collect coins, clear the level!",
score: "Score: ", coins: "Coins: ", gameOver: "GAME OVER", victory: "LEVEL COMPLETE!", restart: "Click or press [Space] to try again",
pressStart: "Click or press [Space] to start", paused: "PAUSED", attempts: "Attempts: ", best: "Best: ", nextTip: "Press N for next level · Esc for menu", level: "Level ", done: "Cleared!"},
zh: { title: "🚀 几何冲刺（Mini Geometry Dash）", instructions: "点击游戏画面 或 按跳跃！收集金币，通关就赢！",
score: "得分: ", coins: "金币: ", gameOver: "游戏结束", victory: "通关成功！", restart: "点击画面 或 按再来一次",
pressStart: "点击画面 或 按开始", paused: "已暂停", attempts: "尝试次数: ", best: "最佳: ", nextTip: "按 N 进下一关 · 按 Esc 回主菜单", level: "第 ", done: "已通关！"},
fr: { title: "🚀 Mini Geometry Dash", instructions: "Cliquez ou appuyez sur [Espace] pour sauter! Ramassez les pièces et terminez le niveau!",
score: "Score: ", coins: "Pièces: ", gameOver: "FIN DE PARTIE", victory: "NIVEAU TERMINÉ!", restart: "Cliquez ou appuyez sur [Espace] pour réessayer",
pressStart: "Cliquez ou appuyez sur [Espace] pour commencer", paused: "PAUSE", attempts: "Essais: ", best: "Record: ", nextTip: "N = niveau suivant · Échap = menu", level: "Niveau ", done: "Terminé!"},
ja: { title: "🚀 ジオメトリーダッシュ ミニ", instructions: "クリックまたは [スペースキー] でジャンプ！コインを集めてステージクリア！",
score: "スコア: ", coins: "コイン: ", gameOver: "ゲームオーバー", victory: "ステージクリア！", restart: "クリックまたは [スペースキー] で再挑戦",
pressStart: "クリックまたは [スペースキー] でスタート", paused: "一時停止中", attempts: "挑戦回数: ", best: "ベスト: ", nextTip: "N = 次のステージ · Esc = メニュー", level: "ステージ ", done: "クリア済み！"}
};
const LEVEL_NAMES = [
{ en: "Green Hills", zh: "青青草地", fr: "Collines vertes", ja: "緑の丘"},
{ en: "Sunset Dash", zh: "落日疾跑", fr: "Course au coucher du soleil", ja: "夕日のダッシュ"},
{ en: "Neon Night", zh: "霓虹之夜", fr: "Nuit néon", ja: "ネオンの夜"}
];
const LEVELS = [
{ speed: 3.2, length: 7000, skyTop: "#1b5e2a", skyBot: "#0b2312", ground: "#07180b", accent: "#00ffcc"},
{ speed: 3.8, length: 9000, skyTop: "#7a3b12", skyBot: "#2a1208", ground: "#1c0e04", accent: "#ffb347"},
{ speed: 4.4, length: 11000, skyTop: "#1b1040", skyBot: "#0b0620", ground: "#120a2a", accent: "#ff5ce1"}
];

let currentLang = "en";
let currentLevel = 0;
let state = "menu"; // menu | playing | paused | dead | won
let soundOn = true;
let audioCtx = null;
let attempts = 0;

const player = { x: 110, y: groundY - 36, size: 36, velocityY: 0, gravity: 0.62, jumpPower: -11, isGrounded: true, angle: 0};
let obstacles = [], coins = [], particles = [];
let distance = 0, score = 0, coinsCollected = 0, coinsSpawned = 0;
let spawnTimer = 0, coinTimer = 300;
let stars = [], clouds = [];
for (let i = 0; i < 60; i++) stars.push({ x: Math.random() * W, y: Math.random() * 200, r: Math.random() * 1.8 + 0.6});
for (let i = 0; i < 7; i++) clouds.push({ x: Math.random() * W, y: 30 + Math.random() * 110, w: 60 + Math.random() * 60});

function t() { return translations[currentLang];}
function levelName() { return LEVEL_NAMES[currentLevel][currentLang] || LEVEL_NAMES[currentLevel].en;}
function bestKey() { return "mgd_best_" + currentLevel;}
function loadBest() { try { return JSON.parse(localStorage.getItem(bestKey())) || null;} catch (e) { return null;}}
function saveBest(pct) {
const prev = loadBest();
const rec = { score: Math.max(score, prev? prev.score: 0), pct: Math.max(Math.floor(pct * 100), prev? prev.pct: 0), done: (prev && prev.done) || state === "won"};
try { localStorage.setItem(bestKey(), JSON.stringify(rec));} catch (e) {}
return rec;
}
function updateStatus() {
const b = loadBest();
const bestTxt = b? (t().best + b.score + " (" + b.pct + "%)" + (b.done? " ⭐ " + t().done: "")): t().best + "-";
document.getElementById("status").textContent = t().level + (currentLevel + 1) + " " + levelName() + " · " + bestTxt + " · " + t().attempts + attempts;
for (let i = 0; i < 3; i++) document.getElementById("lvl" + i).classList.toggle("active", i === currentLevel);
}
function ensureAudio() {
if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)();} catch (e) {}}
if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function tone(freq, dur, type, slideTo) {
if (!soundOn ||!audioCtx) return;
try {
const o = audioCtx.createOscillator(), g = audioCtx.createGain();
o.type = type || "square"; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + dur);
g.gain.setValueAtTime(0.07, audioCtx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur);
} catch (e) {}
}
function spawnParticles(x, y, n, colors) {
for (let i = 0; i < n; i++) particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 7, vy: -Math.random() * 5 - 1, life: 22 + Math.random() * 14, color: colors[Math.floor(Math.random() * colors.length)]});
}
function updateParticles() {
for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.22; p.life--;}
particles = particles.filter(p => p.life > 0);
}

function changeLanguage() {
currentLang = document.getElementById("langSelect").value;
document.getElementById("title").textContent = t().title;
document.getElementById("instructions").textContent = t().instructions;
document.title = t().title;
updateStatus();
}
function selectLevel(i) { currentLevel = i; attempts = 0; startRun();}
function toggleSound() { soundOn =!soundOn; document.getElementById("soundBtn").textContent = soundOn? "🔊 Sound": "🔇 Sound"; if (soundOn) { ensureAudio(); tone(660, 0.1);}}
function togglePause() {
if (state === "playing") { state = "paused"; document.getElementById("pauseBtn").textContent = "▶ Resume";}
else if (state === "paused") { state = "playing"; document.getElementById("pauseBtn").textContent = "⏸ Pause";}
}
function startRun() {
ensureAudio();
player.y = groundY - player.size; player.velocityY = 0; player.isGrounded = true; player.angle = 0;
obstacles = []; coins = []; particles = []; distance = 0; score = 0; coinsCollected = 0; coinsSpawned = 0;
spawnTimer = 30; coinTimer = 260; state = "playing";
document.getElementById("pauseBtn").textContent = "⏸ Pause";
updateStatus();
}
function toMenu() { state = "menu"; updateStatus();}

function spawnObstacle() {
const L = LEVELS[currentLevel];
const r = Math.random();
let ob;
if (currentLevel >= 1 && r < 0.16) ob = { type: "double", x: W, width: 56, height: 30};
else if (r < 0.42) ob = { type: "spike", x: W, width: 26 + Math.random() * 8, height: 30};
else if (r < 0.62) ob = { type: "block", x: W, width: 30, height: 30 + Math.random() * 18};
else if (r < 0.74) ob = { type: "block", x: W, width: 30, height: 56 + Math.random() * 14};
else if (r < 0.88) {
ob = { type: "cloud", x: W, width: 100, height: 16, y: groundY - 85};
if (Math.random() < 0.6) { coins.push({ x: W + 42, y: groundY - 130, r: 13}); coinsSpawned++;}
} else {
ob = { type: "spike", x: W, width: 28, height: 30};
coins.push({ x: W + 14, y: groundY - 95, r: 13}); coinsSpawned++;
}
obstacles.push(ob);
const gap = 260 + Math.random() * 120;
spawnTimer = Math.round((ob.width + gap) / L.speed);
}
function jump() {
if (state === "menu") { startRun(); return;}
if (state === "dead" || state === "won") { startRun(); return;}
if (state === "paused") { togglePause(); return;}
if (player.isGrounded) {
player.velocityY = player.jumpPower; player.isGrounded = false;
tone(350, 0.12, "square", 520);
spawnParticles(player.x + player.size / 2, groundY, 4, ["#ffffff", "#00ffcc"]);
}
}
function die() {
if (state!== "playing") return;
state = "dead"; attempts++;
saveBest(Math.min(1, distance / LEVELS[currentLevel].length));
spawnParticles(player.x + 18, player.y + 18, 22, ["#00ffcc", "#ffffff", "#ff3366"]);
tone(320, 0.35, "sawtooth", 60);
updateStatus();
}
function win() {
state = "won";
saveBest(1);
for (let i = 0; i < 40; i++) spawnParticles(100 + Math.random() * 600, 80 + Math.random() * 150, 1, ["#ffd700", "#00ffcc", "#ff5ce1", "#ffffff"]);
[523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.18, "square"), i * 130));
updateStatus();
}

document.addEventListener("keydown", function (e) {
if (e.code === "Space") { e.preventDefault(); jump();}
else if (e.code === "KeyP") togglePause();
else if (e.code === "Escape") { if (state!== "menu") toMenu();}
else if (e.code === "KeyN") { if (state === "won" && currentLevel < 2) selectLevel(currentLevel + 1);}
});
canvas.addEventListener("pointerdown", function () { jump();});

function update() {
const L = LEVELS[currentLevel];
const speed = L.speed;
distance += speed;
score = Math.floor(distance / 10) + coinsCollected * 50;
const progress = distance / L.length;

if (distance < L.length) {
if (spawnTimer <= 0) spawnObstacle(); else spawnTimer--;
}
if (coinTimer <= 0) {
coins.push({ x: W, y: groundY - 70 - Math.random() * 60, r: 13}); coinsSpawned++;
coinTimer = 300 + Math.random() * 300;
} else coinTimer--;

const prevBottom = player.y + player.size;
const wasAirborne =!player.isGrounded;
player.velocityY += player.gravity;
player.y += player.velocityY;
let currentGround = groundY;
player.isGrounded = false;

for (const obs of obstacles) {
obs.x -= speed;
const bottom = player.y + player.size;
if (obs.type === "spike" || obs.type === "double") {
const top = groundY - obs.height, buf = 6;
if (player.x < obs.x + obs.width - buf && player.x + player.size > obs.x + buf && bottom > top + buf) { die(); return;}
} else if (obs.type === "block") {
const top = groundY - obs.height;
if (player.x + player.size > obs.x && player.x < obs.x + obs.width) {
if (player.velocityY >= 0 && prevBottom <= top + 6 && bottom >= top) currentGround = Math.min(currentGround, top);
else if (bottom > top + 10) { die(); return;}
}
} else if (obs.type === "cloud") {
if (player.x + player.size > obs.x && player.x < obs.x + obs.width) {
if (player.velocityY >= 0 && prevBottom <= obs.y + 6 && bottom >= obs.y) currentGround = Math.min(currentGround, obs.y);
}
}
}
if (player.y + player.size >= currentGround) {
player.y = currentGround - player.size; player.velocityY = 0;
if (wasAirborne) spawnParticles(player.x + 18, currentGround, 5, ["#ffffff"]);
player.isGrounded = true;
player.angle = Math.round(player.angle / (Math.PI / 2)) * (Math.PI / 2);
} else {
player.angle += 0.16;
}
if (player.y > H + 60) { die(); return;}

obstacles = obstacles.filter(o => o.x + o.width > -20);
for (const c of coins) {
c.x -= speed;
const dx = (player.x + 18) - c.x, dy = (player.y + 18) - c.y;
if (!c.taken && dx * dx + dy * dy < 42 * 42) {
c.taken = true; coinsCollected++;
spawnParticles(c.x, c.y, 8, ["#ffd700", "#fff3a0"]);
tone(880, 0.09, "square"); setTimeout(() => tone(1320, 0.12, "square"), 70);
}
}
coins = coins.filter(c =>!c.taken && c.x > -30);
for (const cl of clouds) { cl.x -= speed * 0.3; if (cl.x < -130) { cl.x = W + Math.random() * 200; cl.y = 30 + Math.random() * 110;}}
updateParticles();

if (distance >= L.length && obstacles.length === 0) win();
}

function draw() {
const L = LEVELS[currentLevel];
const grad = ctx.createLinearGradient(0, 0, 0, H);
grad.addColorStop(0, L.skyTop); grad.addColorStop(1, L.skyBot);
ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
ctx.fillStyle = "rgba(255,255,255,0.8)";
for (const s of stars) { const sx = ((s.x - distance * 0.08) % W + W) % W; ctx.fillRect(sx, s.y, s.r, s.r);}
ctx.fillStyle = "rgba(255,255,255,0.14)";
for (const cl of clouds) { ctx.beginPath(); ctx.ellipse(cl.x, cl.y, cl.w / 2, 14, 0, 0, Math.PI * 2); ctx.ellipse(cl.x + 22, cl.y - 8, cl.w / 3, 12, 0, 0, Math.PI * 2); ctx.fill();}
ctx.fillStyle = L.ground; ctx.fillRect(0, groundY, W, H - groundY);
ctx.strokeStyle = L.accent; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
ctx.strokeStyle = "rgba(255,255,255,0.15)"; ctx.lineWidth = 1;
const off = distance % 44;
for (let x = -off; x < W; x += 44) { ctx.beginPath(); ctx.moveTo(x, groundY + 14); ctx.lineTo(x + 18, groundY + 14); ctx.stroke();}

for (const c of coins) {
ctx.fillStyle = "#ffd700"; ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.fill();
ctx.strokeStyle = "#fff3a0"; ctx.lineWidth = 2; ctx.stroke();
ctx.fillStyle = "#8a5a00"; ctx.font = "bold 14px Arial"; ctx.textAlign = "center"; ctx.fillText("★", c.x, c.y + 5); ctx.textAlign = "start";
}
for (const obs of obstacles) {
if (obs.type === "spike" || obs.type === "double") {
ctx.fillStyle = "#ff3366";
const n = obs.type === "double"? 2: 1, sw = obs.width / n;
for (let i = 0; i < n; i++) {
ctx.beginPath(); ctx.moveTo(obs.x + i * sw, groundY); ctx.lineTo(obs.x + i * sw + sw / 2, groundY - obs.height); ctx.lineTo(obs.x + (i + 1) * sw, groundY); ctx.closePath(); ctx.fill();
}
} else if (obs.type === "block") {
ctx.fillStyle = "#ffcc00"; ctx.fillRect(obs.x, groundY - obs.height, obs.width, obs.height);
ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1; ctx.strokeRect(obs.x, groundY - obs.height, obs.width, obs.height);
} else if (obs.type === "cloud") {
ctx.fillStyle = "rgba(255,255,255,0.92)"; ctx.beginPath(); ctx.ellipse(obs.x + obs.width / 2, obs.y + 8, obs.width / 2, 12, 0, 0, Math.PI * 2); ctx.fill();
ctx.fillStyle = "#7ec8ff"; ctx.fillRect(obs.x, obs.y + 14, obs.width, 3);
}
}
ctx.save();
ctx.translate(player.x + player.size / 2, player.y + player.size / 2); ctx.rotate(player.angle);
ctx.fillStyle = "#00ffcc"; ctx.fillRect(-18, -18, 36, 36);
ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.strokeRect(-18, -18, 36, 36);
ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(-9, -8, 4, 0, Math.PI * 2); ctx.arc(9, -8, 4, 0, Math.PI * 2); ctx.fill();
ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(-8, -8, 2, 0, Math.PI * 2); ctx.arc(10, -8, 2, 0, Math.PI * 2); ctx.fill();
ctx.strokeStyle = "#000"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 6, 0.1 * Math.PI, 0.9 * Math.PI, false); ctx.stroke();
ctx.restore();

for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life / 30); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 5, 5);}
ctx.globalAlpha = 1;

ctx.fillStyle = "#fff"; ctx.font = "20px Arial";
ctx.fillText(t().score + score + " " + t().coins + coinsCollected, 20, 35);
ctx.font = "15px Arial"; ctx.fillText(t().level + (currentLevel + 1) + " " + levelName(), W - 190, 35);
const progress = Math.min(1, distance / LEVELS[currentLevel].length);
ctx.fillStyle = "rgba(255,255,255,0.25)"; ctx.fillRect(200, 22, W - 400, 10);
ctx.fillStyle = L.accent; ctx.fillRect(200, 22, (W - 400) * progress, 10);
ctx.fillStyle = "#fff"; ctx.font = "14px Arial"; ctx.fillText(Math.floor(progress * 100) + "%", W - 185, 58);

if (state === "menu" || state === "paused" || state === "dead" || state === "won") {
ctx.fillStyle = "rgba(5, 20, 10, 0.78)"; ctx.fillRect(0, 0, W, H);
ctx.textAlign = "center";
if (state === "menu") {
ctx.fillStyle = "#00ffcc"; ctx.font = "bold 36px Arial"; ctx.fillText(levelName(), W / 2, 140);
ctx.fillStyle = "#fff"; ctx.font = "17px Arial"; ctx.fillText(t().pressStart, W / 2, 185);
const b = loadBest();
if (b) { ctx.font = "15px Arial"; ctx.fillText(t().best + b.score + " (" + b.pct + "%)", W / 2, 215);}
} else if (state === "paused") {
ctx.fillStyle = "#fff"; ctx.font = "bold 36px Arial"; ctx.fillText(t().paused, W / 2, 160);
ctx.font = "16px Arial"; ctx.fillText("P / ⏸ = resume", W / 2, 200);
} else if (state === "dead") {
ctx.fillStyle = "#ff3366"; ctx.font = "bold 36px Arial"; ctx.fillText(t().gameOver, W / 2, 130);
ctx.fillStyle = "#fff"; ctx.font = "16px Arial";
ctx.fillText(Math.floor(progress * 100) + "% · " + t().coins + coinsCollected + " · " + t().attempts + attempts, W / 2, 170);
ctx.fillText(t().restart, W / 2, 205);
} else {
ctx.fillStyle = "#00ffcc"; ctx.font = "bold 36px Arial"; ctx.fillText(t().victory, W / 2, 130);
ctx.fillStyle = "#fff"; ctx.font = "16px Arial";
ctx.fillText(t().score + score + " · " + t().coins + coinsCollected + "/" + coinsSpawned, W / 2, 170);
ctx.fillText(t().restart, W / 2, 205);
if (currentLevel < 2) ctx.fillText(t().nextTip, W / 2, 235);
}
ctx.textAlign = "start";
}
}
function loop() {
requestAnimationFrame(loop);
if (state === "playing") update();
else if (state === "dead" || state === "won") updateParticles();
draw();
}
updateStatus();
loop();
</script>
</body>
</html>
